<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pool League Manager</title><style>:root{font-family:system-ui,Arial;background:#091b16;color:#f4f5ed}*{box-sizing:border-box}body{margin:0}header{padding:24px;background:linear-gradient(110deg,#09281f,#124b36);border-bottom:3px solid #caa95c}h1{margin:0}nav{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px;background:#102c24}button,input,select{font:inherit;padding:10px;border-radius:7px;border:1px solid #547568;background:#183a30;color:white}button{cursor:pointer}button:hover{background:#285644}.gold{background:#caa95c;color:#17231b;border:0;font-weight:700}main{max-width:1100px;margin:auto;padding:22px}.card{background:#123328;border:1px solid #356451;padding:18px;border-radius:12px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}label{display:block;margin:12px 0}input,select{display:block;width:100%;margin-top:5px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #356451;padding:10px;text-align:left}.muted{color:#b4cec0}.hidden{display:none}.error{color:#ffc8aa}#notice{padding:8px;min-height:30px}small{color:#b4cec0}footer{padding:25px;text-align:center;color:#a8c5b5}</style></head><body><header><h1>🎱 Pool League Manager</h1><p>Fixtures • Divisions • Teams • Venues • Competitions</p><div id="who">Public visitor</div></header><nav><button data-page="home">Home</button><button data-page="divisions">Divisions</button><button data-page="teams">Teams & venues</button><button data-page="my-team" id="myTeamNav" class="hidden">My Team</button><button data-page="admin">Administration</button></nav><main><div id="notice" role="status"></div><div id="app"></div></main><footer>Pool League Manager · 2026/27</footer><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const URL='https://trgkhyymwisywpfhsbjm.supabase.co';
const KEY='sb_publishable_GkYMnDHqu7uPFNC_QRx85w_uMzcnj7U';
const db=createClient(URL,KEY);let page='home',user=null,admin=false,managedTeamIds=[],rows={},playerLoadError="",freeAgentLoadError="";const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const msg=(s,error=false)=>{$('#notice').textContent=s;$('#notice').className=error?'error':''};
async function fetchData(){let tables=['seasons','divisions','teams','venues','team_seasons','venue_season_capacity','match_formats','scoring_rules'];for(const t of tables){let r=await db.from(t).select('*');rows[t]=r.data||[];if(r.error&&admin)msg('Unable to read '+t+': '+r.error.message,true)}render()}
const opts=(arr,selected)=>arr.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join('');const name=(t,id)=>rows[t]?.find(x=>x.id===id)?.name||'—';const season=()=>rows.seasons?.find(x=>x.name==='2026/27')||rows.seasons?.[0];
function render(){const s=season();$('#who').textContent=user?`${user.email} · ${admin?'League administrator':managedTeamIds.length?'Team administrator':'Signed in'}`:'Public visitor';$('#myTeamNav').classList.toggle('hidden',!user||(!admin&&!managedTeamIds.length));let html='';if(page==='home')html=`<div class="card"><h2>Welcome to Pool League Manager</h2><p>Season ${esc(s?.name||'2026/27')} · Live match scoring and competitions will be added in later stages.</p></div><div class="grid"><div class="card"><h3>Divisions</h3><h2>${rows.divisions?.length||0}</h2></div><div class="card"><h3>Teams</h3><h2>${rows.teams?.length||0}</h2></div><div class="card"><h3>Venues</h3><h2>${rows.venues?.length||0}</h2></div></div>`;
if(page==='divisions')html=`<h2>Divisions</h2>${(rows.divisions||[]).map(d=>`<div class="card"><h3>${esc(d.name)}</h3><p>${esc(name('seasons',d.season_id))} · ${esc(rows.match_formats?.find(m=>m.division_id===d.id)?.singles_frames||'—')} singles frames · ${esc(rows.scoring_rules?.find(r=>r.division_id===d.id)?.points_per_frame||'—')} point(s) per frame</p></div>`).join('')||'<p>No publicly accessible divisions yet.</p>'}`;
if(page==='teams')html=`<h2>Teams & venues</h2><div class="grid">${(rows.team_seasons||[]).map(ts=>`<div class="card"><h3>${esc(name('teams',ts.team_id))}</h3><p>${esc(name('divisions',ts.division_id))}</p><p>📍 ${esc(name('venues',ts.venue_id))}</p><small>${esc(rows.venues?.find(v=>v.id===ts.venue_id)?.address_line1||'')} ${esc(rows.venues?.find(v=>v.id===ts.venue_id)?.town||'')} ${esc(rows.venues?.find(v=>v.id===ts.venue_id)?.postcode||'')}</small></div>`).join('')||'<div class="card">No teams assigned to this season yet.</div>'}</div>`;
if(page==='my-team'){if(!user)html='<div class="card"><h2>Sign in required</h2><p>Open Administration to sign in.</p></div>';else if(!admin&&!managedTeamIds.length)html='<div class="card"><h2>Access restricted</h2><p>No team administrator assignment was found for this account.</p></div>';else {const teams=rows.teams||[];const permitted=admin?teams:teams.filter(t=>managedTeamIds.includes(t.id));html=`<h2>My Team</h2><p class="muted">Your assigned teams and currently registered players. Free Agent registration and transfer controls will be added later.</p>${playerLoadError?`<div class="card error">Unable to load player list: ${esc(playerLoadError)}</div>`:''}${permitted.map(t=>{const registrations=(rows.active_registrations||[]).filter(pr=>pr.team_id===t.id);return `<div class="card"><h3>${esc(t.name)}</h3>${(rows.team_seasons||[]).filter(ts=>ts.team_id===t.id).map(ts=>`<p>${esc(name('seasons',ts.season_id))} · ${esc(name('divisions',ts.division_id))} · ${esc(name('venues',ts.venue_id))}</p>`).join('')||'<p>No season assignment found.</p>'}<h4>Registered Players (${registrations.length})</h4>${registrations.length?`<table><thead><tr><th>Player</th><th>Season</th><th>Registered</th><th>Status</th></tr></thead><tbody>${registrations.map(pr=>{const player=(rows.players||[]).find(p=>p.id===pr.player_id);return `<tr><td>${esc(player?.full_name||'Player details unavailable')}</td><td>${esc(name('seasons',pr.season_id))}</td><td>${esc(pr.registered_at?new Date(pr.registered_at).toLocaleDateString('en-GB'):'—')}</td><td>Active</td></tr>`}).join('')}</tbody></table>`:'<p>No active player registrations found for this team.</p>'}<h4>Available Free Agents</h4>${freeAgentLoadError?`<p class="error">Unable to load Free Agents: ${esc(freeAgentLoadError)}</p>`:!s?.id?'<p>Season information unavailable.</p>':(rows.free_agents||[]).length?`<table><thead><tr><th>Player</th><th>Approval</th></tr></thead><tbody>${rows.free_agents.map(f=>`<tr><td>${esc(f.player_name)}</td><td>${f.requires_approval?'League approval required':'No approval required'}</td></tr>`).join('')}</tbody></table><small>Read-only list. Registration controls will be added after testing.</small>`:'<p>No available Free Agents found for this season.</p>'}</div>`}).join('')||'<div class="card">No assigned teams could be loaded. Check team read permissions.</div>'}`}}
if(page==='admin'){if(!user)html=`<div class="card"><h2>Administrator sign in</h2><form id="login"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="gold">Sign in</button></form></div>`;else if(!admin)html=`<div class="card"><h2>Team administrator</h2><p>League administration is restricted to league administrators.</p><p>Use <b>My Team</b> to view your assigned team.</p><button id="logout">Sign out</button></div>`;else html=`<h2>League administration</h2><button id="logout">Sign out</button><div class="grid"><form class="card" data-add="venues"><h3>Add venue</h3><label>Name<input name="name" required></label><label>Address<input name="address_line1"></label><label>Address line 2<input name="address_line2"></label><label>Town<input name="town"></label><label>Postcode<input name="postcode"></label><button class="gold">Save venue</button></form><form class="card" data-add="teams"><h3>Add team</h3><label>Team name<input name="name" required></label><button class="gold">Save team</button></form><form class="card" id="capacity"><h3>Venue table capacity</h3><label>Venue<select name="venue_id">${opts(rows.venues||[])}</select></label><label>Season<select name="season_id">${opts(rows.seasons||[])}</select></label><label>Available tables<input name="table_count" type="number" min="1" value="1" required></label><button class="gold">Save capacity</button></form><form class="card" id="assign"><h3>Assign team to division and venue</h3><label>Team<select name="team_id">${opts(rows.teams||[])}</select></label><label>Season<select name="season_id" id="seasonPick">${opts(rows.seasons||[])}</select></label><label>Division<select name="division_id">${opts(rows.divisions||[])}</select></label><label>Venue<select name="venue_id">${opts(rows.venues||[])}</select></label><button class="gold">Save assignment</button></form></div><h3>Existing venues</h3><div class="grid">${(rows.venues||[]).map(v=>`<div class="card"><b>${esc(v.name)}</b><p>${esc([v.address_line1,v.town,v.postcode].filter(Boolean).join(', '))}</p><small>Tables this season: ${esc(rows.venue_season_capacity?.find(c=>c.venue_id===v.id&&c.season_id===s?.id)?.table_count||'Not set')}</small></div>`).join('')}</div><p class="muted">This first release supports adding venues, teams, venue capacity and season assignments. Editing, fixture generation and scoring are planned next.</p>`}
$('#app').innerHTML=html}
async function fetchTeamPlayers(){
  rows.active_registrations=[];rows.players=[];playerLoadError='';
  let query=db.from('player_registrations').select('id,player_id,team_id,season_id,registered_at,left_at').is('left_at',null);
  if(!admin)query=query.in('team_id',managedTeamIds);
  const {data:registrations,error:registrationError}=await query;
  if(registrationError){playerLoadError=registrationError.message;return}
  rows.active_registrations=registrations||[];
  const ids=[...new Set(rows.active_registrations.map(r=>r.player_id))];
  if(!ids.length)return;
  const {data:players,error:playerError}=await db.from('players').select('id,full_name').in('id',ids);
  if(playerError){playerLoadError=playerError.message;return}
  rows.players=players||[];
}
async function fetchFreeAgents(){
  rows.free_agents=[];freeAgentLoadError='';
  const selectedSeason=season();
  if(!selectedSeason?.id)return;
  const {data,error}=await db.rpc('list_free_agents',{p_season_id:selectedSeason.id});
  if(error){freeAgentLoadError=error.message;return}
  rows.free_agents=data||[];
}
async function auth(){const {data:{session}}=await db.auth.getSession();user=session?.user||null;admin=false;managedTeamIds=[];rows.active_registrations=[];rows.players=[];rows.free_agents=[];playerLoadError='';freeAgentLoadError='';if(user){const {data,error}=await db.rpc('is_league_admin');if(error)msg('Admin check failed: '+error.message,true);admin=data===true}await fetchData();if(user&&!admin){const teams=rows.teams||[];const checks=await Promise.all(teams.map(async t=>({id:t.id,...await db.rpc('is_team_administrator',{p_team_id:t.id})})));managedTeamIds=checks.filter(c=>c.data===true&&!c.error).map(c=>c.id);const failed=checks.find(c=>c.error);if(failed)msg('Team role check failed: '+failed.error.message,true)}if(user&&(admin||managedTeamIds.length)){await fetchTeamPlayers();await fetchFreeAgents()}render()}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-page]');if(b){page=b.dataset.page;msg('');render()}if(e.target.id==='logout'){await db.auth.signOut();page='admin';await auth()}});
document.addEventListener('submit',async e=>{const f=e.target;if(!f.matches('#login,[data-add],#capacity,#assign'))return;e.preventDefault();const data=Object.fromEntries(new FormData(f));msg('Saving…');if(f.id==='login'){const {error}=await db.auth.signInWithPassword({email:data.email,password:data.password});if(error)return msg(error.message,true);await auth();msg('Signed in');return}if(!admin)return msg('Administrator access required',true);let error;if(f.dataset.add){({error}=await db.from(f.dataset.add).insert(data))}else if(f.id==='capacity'){data.table_count=Number(data.table_count);({error}=await db.from('venue_season_capacity').upsert(data,{onConflict:'venue_id,season_id'}))}else if(f.id==='assign'){const {data:existing}=await db.from('team_seasons').select('id').eq('team_id',data.team_id).eq('season_id',data.season_id).maybeSingle();({error}=existing?await db.from('team_seasons').update({division_id:data.division_id,venue_id:data.venue_id}).eq('id',existing.id):await db.from('team_seasons').insert(data))}if(error)return msg(error.message,true);await fetchData();if(user&&(admin||managedTeamIds.length)){await fetchTeamPlayers();await fetchFreeAgents()}render();msg('Saved successfully')});
db.auth.onAuthStateChange(()=>{});auth();
</script></body></html>
