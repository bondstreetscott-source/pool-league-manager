<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pool League Manager</title><style>:root{font-family:system-ui,Arial;background:#091b16;color:#f4f5ed}*{box-sizing:border-box}body{margin:0}header{padding:24px;background:linear-gradient(110deg,#09281f,#124b36);border-bottom:3px solid #caa95c}h1{margin:0}nav{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px;background:#102c24}button,input,select{font:inherit;padding:10px;border-radius:7px;border:1px solid #547568;background:#183a30;color:white}button{cursor:pointer}button:hover{background:#285644}.gold{background:#caa95c;color:#17231b;border:0;font-weight:700}main{max-width:1100px;margin:auto;padding:22px}.card{background:#123328;border:1px solid #356451;padding:18px;border-radius:12px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}label{display:block;margin:12px 0}input,select{display:block;width:100%;margin-top:5px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #356451;padding:10px;text-align:left}.muted{color:#b4cec0}.hidden{display:none}.error{color:#ffc8aa}#notice{padding:8px;min-height:30px}small{color:#b4cec0}footer{padding:25px;text-align:center;color:#a8c5b5}</style></head><body><header><h1>🎱 Pool League Manager</h1><p>Fixtures • Divisions • Teams • Venues • Competitions</p><div id="who">Public visitor</div></header><nav><button data-page="home">Home</button><button data-page="divisions">Divisions</button><button data-page="teams">Teams & venues</button><button data-page="my-team" id="myTeamNav" class="hidden">My Team</button><button data-page="admin">Administration</button></nav><main><div id="notice" role="status"></div><div id="app"></div></main><footer>Pool League Manager · 2026/27</footer><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const URL='https://trgkhyymwisywpfhsbjm.supabase.co';
const KEY='sb_publishable_GkYMnDHqu7uPFNC_QRx85w_uMzcnj7U';
const db=createClient(URL,KEY);let page='home',user=null,admin=false,managedTeamIds=[],rows={},playerLoadError="",freeAgentLoadError="",registrationBusy=false,releaseBusy=false,transferBusy=false,transferLoadError="";const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const msg=(s,error=false)=>{$('#notice').textContent=s;$('#notice').className=error?'error':''};
async function fetchData(){let tables=['seasons','divisions','teams','venues','team_seasons','venue_season_capacity','match_formats','scoring_rules'];for(const t of tables){let r=await db.from(t).select('*');rows[t]=r.data||[];if(r.error&&admin)msg('Unable to read '+t+': '+r.error.message,true)}render()}
const opts=(arr,selected)=>arr.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join('');const name=(t,id)=>rows[t]?.find(x=>x.id===id)?.name||'—';const season=()=>rows.seasons?.find(x=>x.name==='2026/27')||rows.seasons?.[0];
function render(){const s=season();$('#who').textContent=user?`${user.email} · ${admin?'League administrator':managedTeamIds.length?'Team administrator':'Signed in'}`:'Public visitor';$('#myTeamNav').classList.toggle('hidden',!user||(!admin&&!managedTeamIds.length));let html='';if(page==='home')html=`<div class="card"><h2>Welcome to Pool League Manager</h2><p>Season ${esc(s?.name||'2026/27')} · Live match scoring and competitions will be added in later stages.</p></div><div class="grid"><div class="card"><h3>Divisions</h3><h2>${rows.divisions?.length||0}</h2></div><div class="card"><h3>Teams</h3><h2>${rows.teams?.length||0}</h2></div><div class="card"><h3>Venues</h3><h2>${rows.venues?.length||0}</h2></div></div>`;
if(page==='divisions')html=`<h2>Divisions</h2>${(rows.divisions||[]).map(d=>`<div class="card"><h3>${esc(d.name)}</h3><p>${esc(name('seasons',d.season_id))} · ${esc(rows.match_formats?.find(m=>m.division_id===d.id)?.singles_frames||'—')} singles frames · ${esc(rows.scoring_rules?.find(r=>r.division_id===d.id)?.points_per_frame||'—')} point(s) per frame</p></div>`).join('')||'<p>No publicly accessible divisions yet.</p>'}`;
if(page==='teams')html=`<h2>Teams & venues</h2><div class="grid">${(rows.team_seasons||[]).map(ts=>`<div class="card"><h3>${esc(name('teams',ts.team_id))}</h3><p>${esc(name('divisions',ts.division_id))}</p><p>📍 ${esc(name('venues',ts.venue_id))}</p><small>${esc(rows.venues?.find(v=>v.id===ts.venue_id)?.address_line1||'')} ${esc(rows.venues?.find(v=>v.id===ts.venue_id)?.town||'')} ${esc(rows.venues?.find(v=>v.id===ts.venue_id)?.postcode||'')}</small></div>`).join('')||'<div class="card">No teams assigned to this season yet.</div>'}</div>`;
if(page==='my-team'){if(!user)html='<div class="card"><h2>Sign in required</h2><p>Open Administration to sign in.</p></div>';else if(!admin&&!managedTeamIds.length)html='<div class="card"><h2>Access restricted</h2><p>No team administrator assignment was found for this account.</p></div>';else {const teams=rows.teams||[];const permitted=admin?teams:teams.filter(t=>managedTeamIds.includes(t.id));html=`<h2>My Team</h2><p class="muted">Your assigned teams and currently registered players. Register Free Agents, request transfers, or release players below. A transfer only completes after destination acceptance and any required league approval.</p>${playerLoadError?`<div class="card error">Unable to load player list: ${esc(playerLoadError)}</div>`:''}${transferLoadError?`<div class="card error">Unable to load transfers: ${esc(transferLoadError)}</div>`:''}${permitted.map(t=>{const registrations=(rows.active_registrations||[]).filter(pr=>pr.team_id===t.id);return `<div class="card"><h3>${esc(t.name)}</h3>${(rows.team_seasons||[]).filter(ts=>ts.team_id===t.id).map(ts=>`<p>${esc(name('seasons',ts.season_id))} · ${esc(name('divisions',ts.division_id))} · ${esc(name('venues',ts.venue_id))}</p>`).join('')||'<p>No season assignment found.</p>'}<h4>Registered Players (${registrations.length})</h4>${registrations.length?`<table><thead><tr><th>Player</th><th>Season</th><th>Registered</th><th>Status</th><th>Action</th></tr></thead><tbody>${registrations.map(pr=>{const player=(rows.players||[]).find(p=>p.id===pr.player_id);const pending=(rows.transfer_requests||[]).find(r=>r.player_id===pr.player_id&&r.season_id===pr.season_id&&r.from_team_id===t.id&&r.status==='pending');const busy=registrationBusy||releaseBusy||transferBusy;return `<tr><td>${esc(player?.full_name||'Player details unavailable')}</td><td>${esc(name('seasons',pr.season_id))}</td><td>${esc(pr.registered_at?new Date(pr.registered_at).toLocaleDateString('en-GB'):'—')}</td><td>${pending?'Active · Transfer Pending':'Active'}</td><td>${pending?`<span>Awaiting ${pending.league_approval_required&&!pending.league_approved_at?'league approval':'destination acceptance'} (${esc(name('teams',pending.to_team_id))})</span> <button type="button" data-cancel-transfer="${esc(pending.id)}" ${busy?'disabled':''}>Cancel Transfer</button>`:`<button type="button" data-release-player="${esc(pr.player_id)}" data-release-season="${esc(pr.season_id)}" data-release-team="${esc(t.id)}" ${busy?'disabled':''}>Release Player</button> <button type="button" class="gold" data-transfer-player="${esc(pr.player_id)}" data-transfer-season="${esc(pr.season_id)}" data-transfer-team="${esc(t.id)}" ${busy||!!transferLoadError?'disabled':''}>Transfer Player</button>`}</td></tr>`}).join('')}</tbody></table>`:'<p>No active player registrations found for this team.</p>'}<h4>Available Free Agents</h4>${freeAgentLoadError?`<p class="error">Unable to load Free Agents: ${esc(freeAgentLoadError)}</p>`:!s?.id?'<p>Season information unavailable.</p>':(rows.free_agents||[]).length?`<table><thead><tr><th>Player</th><th>Approval</th><th>Action</th></tr></thead><tbody>${rows.free_agents.map(f=>`<tr><td>${esc(f.player_name)}</td><td>${f.requires_approval?'League approval required':'No approval required'}</td><td><button type="button" class="gold" data-register-player="${esc(f.player_id)}" data-register-team="${esc(t.id)}" ${registrationBusy||releaseBusy?'disabled':''}>Register Player</button></td></tr>`).join('')}</tbody></table><small>Registration requests requiring approval will be sent to the league administrator.</small>`:'<p>No available Free Agents found for this season.</p>'}</div>`}).join('')||'<div class="card">No assigned teams could be loaded. Check team read permissions.</div>'}${transferPanels(permitted)}`}}
if(page==='admin'){if(!user)html=`<div class="card"><h2>Administrator sign in</h2><form id="login"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="gold">Sign in</button></form></div>`;else if(!admin)html=`<div class="card"><h2>Team administrator</h2><p>League administration is restricted to league administrators.</p><p>Use <b>My Team</b> to view your assigned team.</p><button id="logout">Sign out</button></div>`;else html=`<h2>League administration</h2><button id="logout">Sign out</button><div class="grid"><form class="card" data-add="venues"><h3>Add venue</h3><label>Name<input name="name" required></label><label>Address<input name="address_line1"></label><label>Address line 2<input name="address_line2"></label><label>Town<input name="town"></label><label>Postcode<input name="postcode"></label><button class="gold">Save venue</button></form><form class="card" data-add="teams"><h3>Add team</h3><label>Team name<input name="name" required></label><button class="gold">Save team</button></form><form class="card" id="capacity"><h3>Venue table capacity</h3><label>Venue<select name="venue_id">${opts(rows.venues||[])}</select></label><label>Season<select name="season_id">${opts(rows.seasons||[])}</select></label><label>Available tables<input name="table_count" type="number" min="1" value="1" required></label><button class="gold">Save capacity</button></form><form class="card" id="assign"><h3>Assign team to division and venue</h3><label>Team<select name="team_id">${opts(rows.teams||[])}</select></label><label>Season<select name="season_id" id="seasonPick">${opts(rows.seasons||[])}</select></label><label>Division<select name="division_id">${opts(rows.divisions||[])}</select></label><label>Venue<select name="venue_id">${opts(rows.venues||[])}</select></label><button class="gold">Save assignment</button></form></div><h3>Existing venues</h3><div class="grid">${(rows.venues||[]).map(v=>`<div class="card"><b>${esc(v.name)}</b><p>${esc([v.address_line1,v.town,v.postcode].filter(Boolean).join(', '))}</p><small>Tables this season: ${esc(rows.venue_season_capacity?.find(c=>c.venue_id===v.id&&c.season_id===s?.id)?.table_count||'Not set')}</small></div>`).join('')}</div><p class="muted">This first release supports adding venues, teams, venue capacity and season assignments. Editing, fixture generation and scoring are planned next.</p>`}
$('#app').innerHTML=html}

function transferPanels(permitted){
  const allowed=new Set(permitted.map(t=>t.id));
  const requests=(rows.transfer_requests||[]).filter(r=>r.status==='pending');
  const busy=registrationBusy||releaseBusy||transferBusy;
  const incoming=requests.filter(r=>allowed.has(r.to_team_id));
  const league=requests.filter(r=>admin&&r.league_approval_required===true&&!r.league_approved_at);
  const playerLabel=id=>rows.transfer_players?.find(p=>p.id===id)?.full_name||'Player '+id.slice(0,8);
  const line=r=>`<b>${esc(playerLabel(r.player_id))}</b> · ${esc(name('teams',r.from_team_id))} → ${esc(name('teams',r.to_team_id))}`;
  const incomingRows=incoming.map(r=>`<tr><td>${line(r)}</td><td>${r.league_approval_required&&!r.league_approved_at?'Awaiting league approval':'Awaiting destination acceptance'}</td><td>${r.league_approval_required&&!r.league_approved_at?'League approval required first':`<button class="gold" data-accept-transfer="${esc(r.id)}" ${busy?'disabled':''}>Accept</button> <button data-reject-transfer="${esc(r.id)}" ${busy?'disabled':''}>Reject</button>`}</td></tr>`).join('');
  const leagueRows=league.map(r=>`<tr><td>${line(r)}</td><td><button class="gold" data-approve-transfer="${esc(r.id)}" ${busy?'disabled':''}>League Approve</button> <button data-reject-transfer="${esc(r.id)}" ${busy?'disabled':''}>Reject</button></td></tr>`).join('');
  return `<div class="card"><h3>Incoming Transfers (${incoming.length})</h3>${incoming.length?`<table><thead><tr><th>Player / Teams</th><th>Stage</th><th>Action</th></tr></thead><tbody>${incomingRows}</tbody></table>`:'<p>No incoming transfers awaiting a decision.</p>'}</div>${admin?`<div class="card"><h3>League Transfer Approvals (${league.length})</h3>${league.length?`<table><thead><tr><th>Player / Teams</th><th>Action</th></tr></thead><tbody>${leagueRows}</tbody></table>`:'<p>No transfers awaiting league approval.</p>'}</div>`:''}`;
}
async function fetchTransfers(){
  rows.transfer_requests=[];rows.transfer_players=[];transferLoadError='';
  if(!user||(!admin&&!managedTeamIds.length))return;
  const {data,error}=await db.from('player_transfer_requests').select('id,player_id,season_id,from_team_id,to_team_id,status,league_approval_required,league_approved_at,destination_accepted_at').eq('status','pending');
  if(error){transferLoadError=error.message;return}
  rows.transfer_requests=data||[];
  const ids=[...new Set(rows.transfer_requests.map(r=>r.player_id))];
  if(!ids.length)return;
  const result=await db.from('players').select('id,full_name').in('id',ids);
  if(result.error){transferLoadError=result.error.message;return}
  rows.transfer_players=result.data||[];
}
async function transferDecision(kind,requestId){
  if(transferBusy||releaseBusy||registrationBusy)return;
  const r=(rows.transfer_requests||[]).find(x=>x.id===requestId);
  if(!r)return msg('Transfer request not found. Refresh the page.',true);
  const actions={accept:['accept_player_transfer','Accept'],reject:['reject_player_transfer','Reject'],cancel:['cancel_player_transfer_request','Cancel'],approve:['approve_player_transfer','Approve']};
  const [fn,verb]=actions[kind]||[];if(!fn)return;
  if(!window.confirm(`${verb} transfer for ${rows.transfer_players?.find(p=>p.id===r.player_id)?.full_name||'this player'} from ${name('teams',r.from_team_id)} to ${name('teams',r.to_team_id)}?`))return;
  transferBusy=true;render();msg(`${verb}ing transfer…`);
  try{
    const args={p_request_id:requestId};
    if(kind==='reject'||kind==='approve')args.p_review_notes=null;
    const {error}=await db.rpc(fn,args);
    if(error){msg(`${verb} failed: ${error.message}`,true);return}
    await fetchTeamPlayers();await fetchFreeAgents();await fetchTransfers();
    msg(kind==='accept'?'Transfer accepted and player registration updated.':`Transfer ${kind==='approve'?'approved by league':kind==='reject'?'rejected':'cancelled'} successfully.`);
  }catch(e){msg(`${verb} failed: ${e.message}`,true)}finally{transferBusy=false;render()}
}

async function fetchTeamPlayers(){
  rows.active_registrations=[];rows.players=[];playerLoadError='';
  let query=db.from('player_registrations').select('id,player_id,team_id,season_id,registered_at,left_at').is('left_at',null);
  if(!admin)query=query.in('team_id',managedTeamIds);
  const {data:registrations,error:registrationError}=await query;
  if(registrationError){playerLoadError=registrationError.message;return}
  rows.active_registrations=registrations||[];
  const ids=[...new Set(rows.active_registrations.map(r=>r.player_id))];
  if(!ids.length)return;
  const {data:players,error:playerError}=await db.from('players').select('id,full_name').in('id',ids);
  if(playerError){playerLoadError=playerError.message;return}
  rows.players=players||[];
}
async function fetchFreeAgents(){
  rows.free_agents=[];freeAgentLoadError='';
  const selectedSeason=season();
  if(!selectedSeason?.id)return;
  const {data,error}=await db.rpc('list_free_agents',{p_season_id:selectedSeason.id});
  if(error){freeAgentLoadError=error.message;return}
  rows.free_agents=data||[];
}
async function auth(){const {data:{session}}=await db.auth.getSession();user=session?.user||null;admin=false;managedTeamIds=[];rows.active_registrations=[];rows.players=[];rows.free_agents=[];rows.transfer_requests=[];rows.transfer_players=[];playerLoadError='';freeAgentLoadError='';transferLoadError='';if(user){const {data,error}=await db.rpc('is_league_admin');if(error)msg('Admin check failed: '+error.message,true);admin=data===true}await fetchData();if(user&&!admin){const teams=rows.teams||[];const checks=await Promise.all(teams.map(async t=>({id:t.id,...await db.rpc('is_team_administrator',{p_team_id:t.id})})));managedTeamIds=checks.filter(c=>c.data===true&&!c.error).map(c=>c.id);const failed=checks.find(c=>c.error);if(failed)msg('Team role check failed: '+failed.error.message,true)}if(user&&(admin||managedTeamIds.length)){await fetchTeamPlayers();await fetchFreeAgents();await fetchTransfers()}render()}
async function registerFreeAgent(playerId,teamId){
  if(registrationBusy||releaseBusy||transferBusy||!user||(!admin&&!managedTeamIds.includes(teamId)))return;
  const selectedSeason=season();
  const freeAgent=(rows.free_agents||[]).find(f=>f.player_id===playerId);
  const team=(rows.teams||[]).find(t=>t.id===teamId);
  if(!selectedSeason?.id||!freeAgent||!team)return msg('Unable to confirm the player, team or season. Refresh and try again.',true);
  if(!(rows.team_seasons||[]).some(ts=>ts.team_id===teamId&&ts.season_id===selectedSeason.id))return msg('This team is not assigned to the current season.',true);
  const confirmation=freeAgent.requires_approval
    ?`Request league approval to register ${freeAgent.player_name} for ${team.name}?`
    :`Register ${freeAgent.player_name} for ${team.name} in ${selectedSeason.name}?`;
  if(!window.confirm(confirmation))return;
  registrationBusy=true;render();msg('Submitting player registration…');
  try{
    const {data,error}=await db.rpc('register_free_agent',{
      p_player_id:playerId,p_season_id:selectedSeason.id,p_team_id:teamId,
      p_reason:'Free Agent registration requested by team administrator'
    });
    if(error){msg('Registration failed: '+error.message,true);return}
    await fetchTeamPlayers();await fetchFreeAgents();await fetchTransfers();
    if(data==='registered')msg(`${freeAgent.player_name} registered successfully for ${team.name}.`);
    else if(data==='pending_approval')msg(`Approval request submitted for ${freeAgent.player_name}. The player is not registered until approved.`);
    else msg('Registration request processed. Result: '+String(data??'unknown')+'. Please check player status.');
  }catch(error){msg('Registration failed: '+error.message,true)}
  finally{registrationBusy=false;render()}
}
async function releasePlayer(playerId,seasonId,teamId){
  if(releaseBusy||registrationBusy||transferBusy||!user||(!admin&&!managedTeamIds.includes(teamId)))return;
  const registration=(rows.active_registrations||[]).find(r=>r.player_id===playerId&&r.season_id===seasonId&&r.team_id===teamId);
  const player=(rows.players||[]).find(p=>p.id===playerId);
  const team=(rows.teams||[]).find(t=>t.id===teamId);
  if(!registration||!player||!team)return msg('Unable to verify this active player registration. Refresh and try again.',true);
  if(!window.confirm(`Release ${player.full_name} from ${team.name}? This will end their current registration and make them available as a Free Agent, subject to league rules.`))return;
  releaseBusy=true;render();msg('Releasing player…');
  try{
    const {error}=await db.rpc('release_player_to_free_agent',{
      p_player_id:playerId,p_season_id:seasonId,p_reason:'Released by team administrator'
    });
    if(error){msg('Release failed: '+error.message,true);return}
    await fetchTeamPlayers();await fetchFreeAgents();await fetchTransfers();
    msg(`${player.full_name} released from ${team.name}.`);
  }catch(error){msg('Release failed: '+error.message,true)}
  finally{releaseBusy=false;render()}
}

async function requestTransfer(playerId,seasonId,fromTeamId){
  if(transferBusy||registrationBusy||releaseBusy||!user||(!admin&&!managedTeamIds.includes(fromTeamId)))return;
  const registration=(rows.active_registrations||[]).find(r=>r.player_id===playerId&&r.season_id===seasonId&&r.team_id===fromTeamId);
  const player=(rows.players||[]).find(p=>p.id===playerId);
  const fromTeam=(rows.teams||[]).find(t=>t.id===fromTeamId);
  if(!registration||!player||!fromTeam)return msg('Unable to verify the player registration. Refresh and try again.',true);
  const destinationIds=new Set((rows.team_seasons||[]).filter(ts=>ts.season_id===seasonId&&ts.team_id!==fromTeamId).map(ts=>ts.team_id));
  const destinations=(rows.teams||[]).filter(t=>destinationIds.has(t.id)).sort((a,b)=>a.name.localeCompare(b.name));
  if(!destinations.length)return msg('No other teams are registered in this season.',true);
  const answer=window.prompt(`Transfer ${player.full_name} from ${fromTeam.name} to which team?\n\n${destinations.map((t,i)=>`${i+1}. ${t.name}`).join('\n')}\n\nEnter the destination team number:`);
  if(answer===null)return;
  const choice=answer.trim();
  if(!/^[1-9]\d*$/.test(choice)||Number(choice)>destinations.length)return msg('Invalid destination number. No transfer was requested.',true);
  const destination=destinations[Number(choice)-1];
  if(!window.confirm(`Request transfer of ${player.full_name} from ${fromTeam.name} to ${destination.name}?\n\nThe player will stay with ${fromTeam.name} until the receiving administrator accepts and any required league approval is recorded.`))return;
  transferBusy=true;render();msg('Submitting transfer request…');
  try{
    const {data,error}=await db.rpc('request_player_transfer',{
      p_player_id:playerId,p_season_id:seasonId,p_to_team_id:destination.id,
      p_reason:'Transfer requested by current team administrator'
    });
    if(error){msg('Transfer request failed: '+error.message,true);return}
    await fetchTransfers();
    msg(`Transfer requested for ${player.full_name} to ${destination.name}. Request ID: ${data}. The player remains with ${fromTeam.name} until approved and accepted.`);
  }catch(error){msg('Transfer request failed: '+error.message,true)}
  finally{transferBusy=false;render()}
}
document.addEventListener('click',async e=>{const decision=e.target.closest('[data-accept-transfer],[data-reject-transfer],[data-cancel-transfer],[data-approve-transfer]');if(decision){const kind=decision.hasAttribute('data-accept-transfer')?'accept':decision.hasAttribute('data-reject-transfer')?'reject':decision.hasAttribute('data-cancel-transfer')?'cancel':'approve';await transferDecision(kind,decision.getAttribute('data-'+kind+'-transfer'));return}const transferButton=e.target.closest('[data-transfer-player]');if(transferButton){await requestTransfer(transferButton.dataset.transferPlayer,transferButton.dataset.transferSeason,transferButton.dataset.transferTeam);return}const releaseButton=e.target.closest('[data-release-player]');if(releaseButton){await releasePlayer(releaseButton.dataset.releasePlayer,releaseButton.dataset.releaseSeason,releaseButton.dataset.releaseTeam);return}const registerButton=e.target.closest('[data-register-player]');if(registerButton){await registerFreeAgent(registerButton.dataset.registerPlayer,registerButton.dataset.registerTeam);return}const b=e.target.closest('[data-page]');if(b){page=b.dataset.page;msg('');render()}if(e.target.id==='logout'){await db.auth.signOut();page='admin';await auth()}});
document.addEventListener('submit',async e=>{const f=e.target;if(!f.matches('#login,[data-add],#capacity,#assign'))return;e.preventDefault();const data=Object.fromEntries(new FormData(f));msg('Saving…');if(f.id==='login'){const {error}=await db.auth.signInWithPassword({email:data.email,password:data.password});if(error)return msg(error.message,true);await auth();msg('Signed in');return}if(!admin)return msg('Administrator access required',true);let error;if(f.dataset.add){({error}=await db.from(f.dataset.add).insert(data))}else if(f.id==='capacity'){data.table_count=Number(data.table_count);({error}=await db.from('venue_season_capacity').upsert(data,{onConflict:'venue_id,season_id'}))}else if(f.id==='assign'){const {data:existing}=await db.from('team_seasons').select('id').eq('team_id',data.team_id).eq('season_id',data.season_id).maybeSingle();({error}=existing?await db.from('team_seasons').update({division_id:data.division_id,venue_id:data.venue_id}).eq('id',existing.id):await db.from('team_seasons').insert(data))}if(error)return msg(error.message,true);await fetchData();if(user&&(admin||managedTeamIds.length)){await fetchTeamPlayers();await fetchFreeAgents();await fetchTransfers()}render();msg('Saved successfully')});
db.auth.onAuthStateChange(()=>{});auth();
</script></body></html>
